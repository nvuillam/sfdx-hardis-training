# The deployment actions of the earlier levels, in the order they ran there.
# Reset this level moved them here, so they belong to a Pull Request of this
# fork and travel with the promotions.
commandsPreDeploy:
  - id: 5b2e8c71-0a3d-4f6e-9c1b-026000000003
    label: Set Email Deliverability to All Email
    type: manual
    parameters:
      instructions: |
        1. Open **Setup**, type `Deliverability` in the Quick Find box, and open it.
        2. Under **Access to Send Email**, set **Access level** to **All email**.
        3. Click **Save**.
        4. Check: the page reads **All email**. If it already did, there is nothing to do.
    command: ""
    context: all
commandsPostDeploy:
  - id: 3f6d0a52-24b1-4c1a-9a0e-5b7f02400001
    label: Backfill Crew Size on existing installations
    type: apex
    parameters:
      apexScript: scripts/apex/backfill-crew-size.apex
    command: ""
    context: process-deployment-only
    runOnlyOnceByOrg: true
  - id: 5b2e8c71-0a3d-4f6e-9c1b-026000000001
    label: Load crew capacity reference data
    type: data
    parameters:
      sfdmuProject: HeliosCrewRefData
    command: ""
    context: process-deployment-only
  - id: 5b2e8c71-0a3d-4f6e-9c1b-026000000002
    label: Schedule the nightly crew capacity recalculation
    type: schedule-batch
    parameters:
      className: CrewCapacityBatch
      cronExpression: 0 0 2 * * ?
      jobName: Helios crew capacity nightly
    command: ""
    context: process-deployment-only
    runOnlyOnceByOrg: true
  - id: 8d3a1f64-7c2e-4b9a-a041-041000000001
    label: Load the handover checklist template items
    type: data
    parameters:
      sfdmuProject: HeliosHandoverRefData
    command: ""
    context: process-deployment-only
