        helpUrl: >-
          https://hardisgroupcom.github.io/sfdx-hardis-training/en/level-2-contributor-advanced/2-7-resolve-a-git-merge-conflict/
      - id: training-l2-seed
        label: Set up one of my training orgs
        vscodeIcon: cloud-upload
        sldsIcon: utility:upload
        tooltip: >-
          Deploys the Helios Energy app and its sample data into the org you
          choose
        command: node scripts/training.mjs seed
        helpUrl: >-
          https://hardisgroupcom.github.io/sfdx-hardis-training/en/level-2-contributor-advanced/
